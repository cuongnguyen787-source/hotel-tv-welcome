<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel TV Welcome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1c;
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6vh 8vw;
      background-color: #090d16;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .screen.active { display: flex; }

    /* Lớp phủ tối bán trong suốt giúp chữ luôn rõ nét trên mọi ảnh nền */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(9, 13, 22, 0.58) 0%,
        rgba(9, 13, 22, 0.72) 50%,
        rgba(9, 13, 22, 0.85) 100%
      );
      z-index: 1;
    }
    .screen-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Hiệu ứng chữ hiện lần lượt */
    .reveal-line {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hotel-brand {
      font-size: 2.2vw;
      letter-spacing: 0.35em;
      color: #fbbf24;
      text-transform: uppercase;
      margin-bottom: 2vh;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }
    .room-badge {
      font-size: 1.8vw;
      padding: 0.8vh 2.2vw;
      border: 1px solid rgba(251, 191, 36, 0.75);
      background: rgba(15, 23, 42, 0.55);
      border-radius: 999px;
      color: #fde68a;
      margin-bottom: 4vh;
    }
    .welcome-label {
      font-size: 2.8vw;
      color: #f1f5f9;
      margin-bottom: 2vh;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      margin-bottom: 4vh;
    }
    .guest-name {
      font-size: 4.8vw;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 28px rgba(251, 191, 36, 0.35);
    }
    .greeting-note {
      font-size: 2.2vw;
      color: #e2e8f0;
      max-width: 75vw;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    /* Màn hình quảng cáo */
    .promo-title {
      font-size: 4.2vw;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 3vh;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }
    .promo-sub {
      font-size: 2.6vw;
      color: #f8fafc;
      max-width: 80vw;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    #promoVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }
    .hint-bar {
      position: fixed;
      bottom: 2.2vh;
      right: 3vw;
      font-size: 1.3vw;
      color: rgba(255,255,255,0.6);
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- MÀN 1: LỜI CHÀO RIÊNG TỪNG PHÒNG -->
  <div id="welcomeScreen" class="screen">
    <div class="bg-overlay"></div>
    <div class="screen-content">
      <div id="wHotel" class="hotel-brand reveal-line">KHÁCH SẠN</div>
      <div id="wRoom" class="room-badge reveal-line">PHÒNG 201</div>
      <div id="wLabel" class="welcome-label reveal-line">Trân trọng chào đón Quý khách</div>
      <div id="wGuests" class="guest-list"></div>
      <div id="wNote" class="greeting-note reveal-line"></div>
    </div>
  </div>

  <!-- MÀN 2A: VIDEO QUẢNG BÁ KHÁCH SẠN (NẾU CÓ LINK MP4) -->
  <div id="videoScreen" class="screen" style="padding:0;">
    <video id="promoVideo" playsinline muted></video>
  </div>

  <!-- MÀN 2B: SLIDE QUẢNG BÁ KHÁCH SẠN (NẾU CHƯA DÙNG VIDEO) -->
  <div id="slideScreen" class="screen">
    <div class="bg-overlay"></div>
    <div class="screen-content">
      <div id="sHotel" class="hotel-brand reveal-line">KHÁCH SẠN</div>
      <div id="sTitle" class="promo-title reveal-line"></div>
      <div id="sSub" class="promo-sub reveal-line"></div>
    </div>
  </div>

  <div class="hint-bar">Bấm HOME hoặc BACK để về màn hình chính</div>

  <script>
    const params = new URLSearchParams(location.search);
    const roomId = params.get('room') || '201';
    let configData = null;
    let loopTimer = null;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 4 || e.keyCode === 27) {
        if (window.fully && typeof fully.exit === 'function') {
          fully.exit();
        } else {
          window.close();
        }
      }
    });

    async function fetchConfig() {
      try {
        const res = await fetch('./rooms.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          configData = await res.json();
        }
      } catch (err) {
        console.error('Lỗi tải rooms.json:', err);
      }
    }

    function applyBackground(screenEl) {
      const bgUrl = (configData?.welcomeBgUrl || '').trim();
      if (bgUrl) {
        screenEl.style.backgroundImage = `url("${bgUrl}")`;
      } else {
        screenEl.style.backgroundImage = 'radial-gradient(circle at top, #1e293b 0%, #090d16 100%)';
      }
    }

    function hideAllScreens() {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      const vid = document.getElementById('promoVideo');
      vid.pause();
    }

    function showSequential(elements, stepDelay = 700) {
      elements.forEach(el => el.classList.remove('show'));
      elements.forEach((el, idx) => {
        setTimeout(() => el.classList.add('show'), 150 + idx * stepDelay);
      });
    }

    function playWelcomePhase(onComplete) {
      const roomInfo = configData?.rooms?.[roomId];
      if (!roomInfo || !roomInfo.active || !roomInfo.guests || roomInfo.guests.length === 0) {
        onComplete();
        return;
      }

      hideAllScreens();
      const screen = document.getElementById('welcomeScreen');
      applyBackground(screen);
      screen.classList.add('active');

      const wHotel = document.getElementById('wHotel');
      const wRoom = document.getElementById('wRoom');
      const wLabel = document.getElementById('wLabel');
      const wGuests = document.getElementById('wGuests');
      const wNote = document.getElementById('wNote');

      wHotel.textContent = configData.hotelName || 'KHÁCH SẠN';
      wRoom.textContent = 'PHÒNG ' + roomId;
      wLabel.textContent = 'Trân trọng chào đón Quý khách';
      wNote.textContent = roomInfo.greeting || 'Chúc Quý khách kỳ nghỉ vui vẻ!';

      wGuests.innerHTML = '';
      const guestEls = roomInfo.guests.map(name => {
        const div = document.createElement('div');
        div.className = 'guest-name reveal-line';
        div.textContent = name;
        wGuests.appendChild(div);
        return div;
      });

      const sequence = [wHotel, wRoom, wLabel, ...guestEls, wNote];
      showSequential(sequence, 750);

      const totalTime = 150 + sequence.length * 750 + 4500;
      loopTimer = setTimeout(onComplete, totalTime);
    }

    function playPromoPhase(onComplete) {
      if (configData?.promoVideoUrl) {
        hideAllScreens();
        const vScreen = document.getElementById('videoScreen');
        const vid = document.getElementById('promoVideo');
        vScreen.classList.add('active');
        vid.src = configData.promoVideoUrl;
        vid.muted = false;
        vid.onended = onComplete;
        vid.onerror = () => runPromoSlides(onComplete);
        vid.play().catch(() => {
          vid.muted = true;
          vid.play().catch(() => runPromoSlides(onComplete));
        });
      } else {
        runPromoSlides(onComplete);
      }
    }

    function runPromoSlides(onComplete) {
      const slides = configData?.promoSlides || [];
      if (slides.length === 0) {
        loopTimer = setTimeout(onComplete, 3000);
        return;
      }
      let idx = 0;
      function nextSlide() {
        if (idx >= slides.length) {
          onComplete();
          return;
        }
        hideAllScreens();
        const sScreen = document.getElementById('slideScreen');
        applyBackground(sScreen);
        sScreen.classList.add('active');
        const sHotel = document.getElementById('sHotel');
        const sTitle = document.getElementById('sTitle');
        const sSub = document.getElementById('sSub');

        sHotel.textContent = configData.hotelName || 'KHÁCH SẠN';
        sTitle.textContent = slides[idx].title;
        sSub.textContent = slides[idx].subtitle;

        showSequential([sHotel, sTitle, sSub], 600);
        const dur = (slides[idx].duration || 6) * 1000;
        idx++;
        loopTimer = setTimeout(nextSlide, dur);
      }
      nextSlide();
    }

    async function startCycle() {
      clearTimeout(loopTimer);
      await fetchConfig();
      playWelcomePhase(() => {
        playPromoPhase(() => {
          startCycle();
        });
      });
    }

    startCycle();
  </script>
</body>
</html>
